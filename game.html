<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Game v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Firebase v12 -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
      import { getFirestore, collection, addDoc, getDocs, orderBy, query, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB6f3ry1IN8Yfwqxtfc6-amZqX6_eZYJzQ",
        authDomain: "juanjo-leaderboard.firebaseapp.com",
        projectId: "juanjo-leaderboard",
        storageBucket: "juanjo-leaderboard.firebasestorage.app",
        messagingSenderId: "488442252971",
        appId: "1:488442252971:web:5602dd92c6f538b2f031ee",
        measurementId: "G-2E33E89WW4"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      window._fbSaveScore = async function(name, score) {
        try {
          await addDoc(collection(db, "leaderboard"), {
            name: name.trim().substring(0, 16) || "Anonymous",
            score: score,
            timestamp: serverTimestamp()
          });
          return true;
        } catch(e) {
          console.error("Error saving score:", e);
          return false;
        }
      };

      window._fbGetLeaderboard = async function() {
        try {
          const q = query(collection(db, "leaderboard"), orderBy("score","desc"), limit(10));
          const snap = await getDocs(q);
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        } catch(e) {
          console.error("Error fetching leaderboard:", e);
          return [];
        }
      };

      window._fbReady = true;
    </script>

    <style>
        :root {
            --green-dark: #0d2b1e;
            --green-mid: #1a4b3a;
            --green-teal: #00b4a6;
            --green-bright: #00ffd0;
            --gold: #ffd700;
            --gold-light: #ffe84d;
            --red: #ff4757;
            --purple: #a855f7;
            --pink: #ec4899;
            --blue: #3b82f6;
            --orange: #f97316;
            --white: #f0faf8;
            --font-game: 'Orbitron', monospace;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: radial-gradient(ellipse at top, #0d2b1e 0%, #040d08 60%, #000 100%);
            min-height: 100vh;

        /* TITLE */

            position: relative;
        }

        .game-title {

            font-size: clamp(1.8rem, 7vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, #00ffd0 0%, #00b4a6 30%, #a855f7 60%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 18px rgba(0,255,208,0.4));
            line-height: 1.1;
        }

        .game-version {
            font-family: var(--font-game);
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            color: var(--gold);
            letter-spacing: 0.15em;

        /* MAIN LAYOUT */

            display: flex;
            gap: 18px;
            align-items: flex-start;
            width: 100%;
            max-width: 820px;
            justify-content: center;
        }

        /* GAME PANEL */

            align-items: center;

        }

        .score-row {

        .stat-box {
            background: rgba(0,180,166,0.08);
            border: 1px solid rgba(0,180,166,0.3);
            border-radius: 10px;
            padding: 6px 18px;
            text-align: center;

        .stat-label {

            font-size: 0.6rem;
            color: var(--green-teal);

        #bestScore { color: var(--gold); }

        canvas {

            border-radius: 12px;
            box-shadow: 0 0 32px rgba(0,180,166,0.18), 0 0 80px rgba(0,0,0,0.5);

        }

        .controls {

        }

        @media (max-width: 380px) {

<body>

    <div class="title-wrapper">
        <div class="game-title">🐍 SNAKE GAME</div>
        <div class="game-version">VERSION 2.0 — LEADERBOARD EDITION</div>
    </div>

    <div class="main-layout">

        <div class="game-panel">
            <div class="score-row">
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Best</div>
                    <div class="stat-value" id="bestScore">0</div>
                </div>
            </div>

            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="controls">
                <button class="ctrl-btn" id="leftBtn">◀ UP-LEFT</button>
                <button class="ctrl-btn" id="rightBtn">DOWN-RIGHT ▶</button>
            </div>
            <div class="keyboard-hint">KEYBOARD: ← ↑ ↓ →  |  WASD</div>
        </div>

        <div class="leaderboard-panel">
            <div class="lb-title">🏆 TOP 10 PLAYERS</div>
            <ul class="lb-list" id="sidebarLb">
                <li class="lb-loading">Loading…</li>
            </ul>
        </div>

    </div>

    <div class="overlay" id="gameOverOverlay">
        <div class="modal">
            <div class="modal-title">GAME OVER</div>
            <div class="modal-score">Your score: <strong id="finalScore">0</strong></div>

            <div class="name-section">
                <label for="playerName">Enter Your Name</label>
                <input type="text" id="playerName" class="name-input" maxlength="16" placeholder="Your name here…" autocomplete="off">
            </div>

            <div class="modal-lb">
                <div class="modal-lb-title">🏆 Leaderboard</div>
                <div id="modalLbContent"><div class="lb-loading">Loading…</div></div>
            </div>

            <div class="modal-btns">
                <button class="btn-submit" id="saveBtn">💾 SAVE SCORE</button>
                <button class="btn-play" id="playAgainBtn">▶ PLAY AGAIN</button>
            </div>
            <div class="save-status" id="saveStatus"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');
        const finalScoreEl = document.getElementById('finalScore');
        const overlay = document.getElementById('gameOverOverlay');
        const saveBtn = document.getElementById('saveBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const playerNameEl = document.getElementById('playerName');
        const saveStatusEl = document.getElementById('saveStatus');

        const GRID = 20;
        const COLS = 20;
        const CELL = canvas.width / COLS;

        let snake, direction, food, score, bestScore = 0, gameRunning, gameStarted, loopTimeout;
        let scoreSaved = false;

        const images = {};
        const imageUrls = {
            up: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Up.png',
            down: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Down.png',
            left: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Left.png',
            right: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Right.png',
            upOpen: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Up_open.png',
            downOpen: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Down_open.png',
            leftOpen: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Left_open.png',
            rightOpen: 'https://raw.githubusercontent.com/alexanderbacca/alexanderbacca.github.io/main/Right_open.png'
        };
        let imagesLoaded = 0;
        const totalImages = Object.keys(imageUrls).length;

        function preloadImages() {
            Object.keys(imageUrls).forEach(key => {
                images[key] = new Image();
                images[key].crossOrigin = "anonymous";
                images[key].onload = images[key].onerror = () => {
                    if (++imagesLoaded === totalImages) startGame();
                };
                images[key].src = imageUrls[key];
            });
        }

        function getHeadImage() {
            const head = snake[0];
            const d = Math.abs(head.x - food.x) + Math.abs(head.y - food.y);
            const near = d <= 2;
            if (direction.x === 0 && direction.y === -1) return near ? images.upOpen : images.up;
            if (direction.x === 0 && direction.y === 1)  return near ? images.downOpen : images.down;
            if (direction.x === -1)                       return near ? images.leftOpen : images.left;
            return near ? images.rightOpen : images.right;
        }

        function generateFood() {
            let f;
            do { f = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*COLS) }; }
            while (snake.some(s => s.x === f.x && s.y === f.y));
            return f;
        }

        function handleLeft() {
            if (!gameRunning || !gameStarted) return;
            const d = direction;
            if (d.x === 1)       direction = {x:0, y:-1};
            else if (d.y === 1)  direction = {x:-1, y:0};
            else if (d.y === -1) direction = {x:-1, y:0};
            else if (d.x === -1) direction = {x:0, y:-1};
        }
        function handleRight() {
            if (!gameRunning || !gameStarted) return;
            const d = direction;
            if (d.y === -1)      direction = {x:1, y:0};
            else if (d.x === -1) direction = {x:0, y:1};
            else if (d.y === 1)  direction = {x:1, y:0};
            else if (d.x === 1)  direction = {x:0, y:1};
        }

        const keyMap = {
            'ArrowLeft': () => { if (direction.x !== 1)  direction = {x:-1, y:0}; },
            'ArrowRight': () => { if (direction.x !== -1) direction = {x:1, y:0}; },
            'ArrowUp': () => { if (direction.y !== 1)   direction = {x:0, y:-1}; },
            'ArrowDown': () => { if (direction.y !== -1) direction = {x:0, y:1}; },
            'a': () => { if (direction.x !== 1)  direction = {x:-1, y:0}; },
            'd': () => { if (direction.x !== -1) direction = {x:1, y:0}; },
            'w': () => { if (direction.y !== 1)  direction = {x:0, y:-1}; },
            's': () => { if (direction.y !== -1) direction = {x:0, y:1}; },
        };
        document.addEventListener('keydown', e => {
            if (!gameRunning || !gameStarted) return;
            const fn = keyMap[e.key] || keyMap[e.key.toLowerCase()];
            if (fn) { e.preventDefault(); fn(); }
        });

        function update() {
            if (!gameRunning) return;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= COLS) { triggerGameOver(); return; }
            if (snake.some(s => s.x === head.x && s.y === head.y)) { triggerGameOver(); return; }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = score;
                if (score > bestScore) { bestScore = score; bestScoreEl.textContent = bestScore; }
                food = generateFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(0,12,7,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(0,180,166,0.06)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
            }

            for (let i = 1; i < snake.length; i++) {
                const ratio = i / snake.length;
                const g = Math.round(180 - ratio * 60);
                const b = Math.round(166 - ratio * 50);
                ctx.fillStyle = `rgb(0,${g},${b})`;
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.lineWidth = 1;
                const x = snake[i].x * CELL + 2;
                const y = snake[i].y * CELL + 2;
                const sz = CELL - 4;
                ctx.beginPath();
                ctx.roundRect(x, y, sz, sz, 4);
                ctx.fill();
                ctx.stroke();
            }

            if (snake.length > 0) {
                const img = getHeadImage();
                const hx = snake[0].x * CELL, hy = snake[0].y * CELL;
                if (img && img.complete && img.naturalWidth > 0) {
                    ctx.drawImage(img, hx, hy, CELL, CELL);
                } else {
                    ctx.fillStyle = '#2d7a5f';
                    ctx.beginPath();
                    ctx.roundRect(hx+1, hy+1, CELL-2, CELL-2, 5);
                    ctx.fill();
                }
            }

            const fx = food.x * CELL + CELL/2;
            const fy = food.y * CELL + CELL/2;
            const fr = CELL/2 - 3;
            const grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, fr+6);
            grad.addColorStop(0, 'rgba(255,80,80,0.5)');
            grad.addColorStop(1, 'rgba(255,80,80,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(fx, fy, fr+6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ff4757';
            ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath(); ctx.arc(fx - fr*0.25, fy - fr*0.25, fr*0.35, 0, Math.PI*2); ctx.fill();
        }

        function triggerGameOver() {
            gameRunning = false;
            clearTimeout(loopTimeout);
            finalScoreEl.textContent = score;
            scoreSaved = false;
            saveStatusEl.textContent = '';
            saveBtn.disabled = false;
            overlay.classList.add('active');
            loadAndShowLeaderboard();
        }

        function restartGame() {
            overlay.classList.remove('active');
            snake = [{x:10, y:10}];
            direction = {x:0, y:-1};
            food = generateFood();
            score = 0;
            gameRunning = true;
            gameStarted = true;
            scoreSaved = false;
            scoreEl.textContent = 0;
            gameLoop();
        }

        function gameLoop() {
            if (gameRunning) update();
            draw();
            loopTimeout = setTimeout(() => requestAnimationFrame(gameLoop), 150);
        }

        function startGame() {
            snake = [{x:10, y:10}];
            direction = {x:0, y:-1};
            food = generateFood();
            score = 0;
            gameRunning = true;
            gameStarted = true;
            gameLoop();
            loadSidebarLeaderboard();
        }

        function rankEmoji(i) {
            if (i === 0) return '🥇';
            if (i === 1) return '🥈';
            if (i === 2) return '🥉';
            return `#${i+1}`;
        }

        async function loadSidebarLeaderboard() {
            const el = document.getElementById('sidebarLb');
            if (!window._fbGetLeaderboard) {
                el.innerHTML = '<li class="lb-empty">Firebase loading…</li>';
                setTimeout(loadSidebarLeaderboard, 1500);
                return;
            }
            const entries = await window._fbGetLeaderboard();
            if (!entries.length) {
                el.innerHTML = '<li class="lb-empty">No scores yet!</li>';
                return;
            }
            el.innerHTML = entries.map((e,i) => `
                <li class="lb-item">
                    <span class="lb-rank">${rankEmoji(i)}</span>
                    <span class="lb-name">${escHtml(e.name)}</span>
                    <span class="lb-score">${e.score}</span>
                </li>`).join('');
        }

        async function loadAndShowLeaderboard() {
            const el = document.getElementById('modalLbContent');
            el.innerHTML = '<div class="lb-loading">Loading…</div>';
            if (!window._fbGetLeaderboard) {
                await new Promise(r => setTimeout(r, 1500));
            }
            const entries = await window._fbGetLeaderboard();
            if (!entries.length) {
                el.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
                return;
            }
            el.innerHTML = entries.map((e,i) => {
                const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
                return `<div class="modal-lb-item">
                    <span class="modal-lb-rank ${cls}">${rankEmoji(i)}</span>
                    <span class="modal-lb-name">${escHtml(e.name)}</span>
                    <span class="modal-lb-score">${e.score}</span>
                </div>`;
            }).join('');
        }

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        saveBtn.addEventListener('click', async () => {
            if (scoreSaved) return;
            const name = playerNameEl.value.trim() || 'Anonymous';
            saveBtn.disabled = true;
            saveStatusEl.className = 'save-status';
            saveStatusEl.textContent = '⏳ Saving…';

            if (!window._fbSaveScore) {
                await new Promise(r => setTimeout(r, 1000));
            }

            const ok = window._fbSaveScore ? await window._fbSaveScore(name, score) : false;
            if (ok) {
                scoreSaved = true;
                saveStatusEl.textContent = '✅ Score saved to leaderboard!';
                await loadAndShowLeaderboard();
                await loadSidebarLeaderboard();
            } else {
                saveBtn.disabled = false;
                saveStatusEl.className = 'save-status error';
                saveStatusEl.textContent = '❌ Save failed. Try again.';
            }
        });

        playAgainBtn.addEventListener('click', restartGame);

        playerNameEl.addEventListener('keydown', e => {
            if (e.key === 'Enter') saveBtn.click();
        });

        document.addEventListener('contextmenu', e => e.preventDefault());

        ['click','touchstart'].forEach(ev => {
            document.getElementById('leftBtn').addEventListener(ev, e => { e.preventDefault(); handleLeft(); });
            document.getElementById('rightBtn').addEventListener(ev, e => { e.preventDefault(); handleRight(); });
        });

        preloadImages();
    </script>
</body>
</html>
