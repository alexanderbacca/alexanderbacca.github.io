<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-10 text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-600 text-white py-5 px-4 shadow-md text-center">
    <h1 class="text-xl font-bold tracking-wide">💸 Debt Tracker</h1>
    <p class="text-xs text-indigo-200 mt-1">Quick Ledger & Silent Google Sync</p>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Status Alert Toast -->
    <div id="toast" class="hidden p-3 rounded-lg text-sm font-semibold text-center transition-all duration-300"></div>

    <!-- Transaction Entry Form -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-base font-bold text-slate-700 mb-4 flex items-center gap-2">
        <span>📝 New Entry</span>
      </h2>

      <form id="debtForm" class="space-y-4">
        
        <!-- Transaction Type Toggle -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Transaction Type</label>
          <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
            <button type="button" id="btnLent" onclick="setType('lent')" class="py-2 rounded-lg text-sm font-bold bg-emerald-500 text-white shadow-sm transition">
              ➕ Money Lent (+)
            </button>
            <button type="button" id="btnRepay" onclick="setType('repay')" class="py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition">
              ➖ Repayment (-)
            </button>
          </div>
          <input type="hidden" id="txType" value="lent">
        </div>

        <!-- Date Input -->
        <div>
          <label for="date" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Date</label>
          <input type="date" id="date" required class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Description Input -->
        <div>
          <label for="description" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Description <span class="text-slate-400 font-normal">(Optional)</span></label>
          <input type="text" id="description" placeholder="e.g. Lunch, Hardware store, Cash payback" class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Payment Method -->
        <div>
          <label for="method" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Payment Method</label>
          <select id="method" required class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
            <option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Amount Input -->
        <div>
          <label for="amount" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Amount ($)</label>
          <input type="number" step="0.01" id="amount" placeholder="0.00" required class="w-full border border-slate-300 rounded-xl p-3 text-slate-800 text-lg font-bold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition active:scale-[0.98]">
          Save & Sync Entry
        </button>
      </form>
    </section>

    <!-- Local Storage: Last 5 Movements -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Last 5 Movements (Local)</h3>
        <span class="text-xs text-slate-400">Tap card to load</span>
      </div>

      <div id="recentList" class="space-y-2">
        <!-- Dynamic Cards Inserted Here -->
      </div>
    </section>

  </main>

  <script>
    // --- GOOGLE FORM CONFIGURATION ---
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSccER86-7s1gIHj-S7vcZwOIXUighDgw3hNiaK304X0NrqpOQ/formResponse";
    const ENTRY_IDS = {
      date: "entry.1879533945",
      description: "entry.843653909",
      method: "entry.1728172138",
      amount: "entry.290996914"
    };

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
      // Default to Today's Date
      document.getElementById("date").value = new Date().toISOString().split("T")[0];
      renderRecentMovements();
    });

    // --- TYPE TOGGLE LOGIC ---
    function setType(type) {
      const btnLent = document.getElementById("btnLent");
      const btnRepay = document.getElementById("btnRepay");
      const txType = document.getElementById("txType");

      txType.value = type;
      if (type === "lent") {
        btnLent.className = "py-2 rounded-lg text-sm font-bold bg-emerald-500 text-white shadow-sm transition";
        btnRepay.className = "py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition";
      } else {
        btnLent.className = "py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition";
        btnRepay.className = "py-2 rounded-lg text-sm font-bold bg-rose-500 text-white shadow-sm transition";
      }
    }

    // --- FORM SUBMISSION & SILENT SYNC ---
    document.getElementById("debtForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Syncing...";

      const date = document.getElementById("date").value;
      const description = document.getElementById("description").value || "-";
      const method = document.getElementById("method").value;
      const rawAmount = parseFloat(document.getElementById("amount").value);
      const isLent = document.getElementById("txType").value === "lent";

      // Apply positive (+) or negative (-) math
      const finalAmount = isLent ? Math.abs(rawAmount) : -Math.abs(rawAmount);

      // Construct Form Payload
      const formData = new URLSearchParams();
      formData.append(ENTRY_IDS.date, date);
      formData.append(ENTRY_IDS.description, description);
      formData.append(ENTRY_IDS.method, method);
      formData.append(ENTRY_IDS.amount, finalAmount);

      let success = false;

      // Silent background fetch (no-cors mode for Google Forms)
      try {
        await fetch(FORM_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });
        success = true;
      } catch (err) {
        console.warn("Network submission failed, saved locally only.", err);
        success = false;
      }

      // Save to Local Storage Buffer
      saveToLocalStorage({
        id: Date.now(),
        date,
        description,
        method,
        amount: finalAmount,
        synced: success
      });

      // Show Feedback Toast
      showToast(
        success ? "✅ Saved & Synced to Google Sheets!" : "⚠️ Saved locally (Offline mode)",
        success ? "bg-emerald-100 text-emerald-800 border border-emerald-300" : "bg-amber-100 text-amber-800 border border-amber-300"
      );

      // Reset Inputs (Keep Date set to Today)
      document.getElementById("description").value = "";
      document.getElementById("amount").value = "";
      document.getElementById("date").value = new Date().toISOString().split("T")[0];
      setType("lent");

      submitBtn.disabled = false;
      submitBtn.innerText = "Save & Sync Entry";

      renderRecentMovements();
    });

    // --- LOCAL STORAGE MANAGER ---
    function getStoredMovements() {
      return JSON.parse(localStorage.getItem("debt_tracker_recent") || "[]");
    }

    function saveToLocalStorage(entry) {
      let list = getStoredMovements();
      list.unshift(entry); // Add to top
      list = list.slice(0, 5); // Keep only the last 5
      localStorage.setItem("debt_tracker_recent", JSON.stringify(list));
    }

    // --- UI RENDERER FOR LAST 5 MOVEMENTS ---
    function renderRecentMovements() {
      const list = getStoredMovements();
      const container = document.getElementById("recentList");

      if (list.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">No entries saved locally yet.</div>`;
        return;
      }

      container.innerHTML = list.map((item) => {
        const isPositive = item.amount > 0;
        const formattedAmount = (isPositive ? "+" : "") + Number(item.amount).toFixed(2);
        const badgeColor = isPositive ? "text-emerald-600 bg-emerald-50" : "text-rose-600 bg-rose-50";

        return `
          <div onclick="loadEntryIntoForm(${item.id})" class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center cursor-pointer hover:border-indigo-400 transition active:scale-[0.99]">
            <div class="space-y-0.5">
              <div class="text-sm font-bold text-slate-800">${escapeHtml(item.description)}</div>
              <div class="text-xs text-slate-400 flex gap-2">
                <span>📅 ${item.date}</span>
                <span>•</span>
                <span>💳 ${escapeHtml(item.method)}</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-base font-extrabold ${badgeColor} px-2.5 py-1 rounded-lg inline-block">
                $${formattedAmount}
              </div>
              <div class="text-[10px] text-slate-400 mt-0.5">${item.synced ? "🟢 Synced" : "🟡 Local"}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    // --- RE-LOAD PAST ENTRY INTO FORM ---
    function loadEntryIntoForm(id) {
      const list = getStoredMovements();
      const entry = list.find(item => item.id === id);
      if (!entry) return;

      document.getElementById("date").value = entry.date;
      document.getElementById("description").value = entry.description === "-" ? "" : entry.description;
      document.getElementById("method").value = entry.method;
      document.getElementById("amount").value = Math.abs(entry.amount);
      setType(entry.amount > 0 ? "lent" : "repay");

      showToast("📥 Loaded entry into form. Edit or resubmit!", "bg-indigo-100 text-indigo-800 border border-indigo-300");
    }

    // --- HELPER FUNCTIONS ---
    function showToast(msg, classes) {
      const toast = document.getElementById("toast");
      toast.className = `p-3 rounded-lg text-sm font-semibold text-center transition-all duration-300 ${classes}`;
      toast.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3500);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
