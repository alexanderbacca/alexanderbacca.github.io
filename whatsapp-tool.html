<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Quick Message - Alexander Bacca</title>
    <meta name="description" content="Send a WhatsApp message to any Colombian number instantly. No need to save the contact.">
    <link rel="icon" href="./WhatsappEasy.ico" type="image/x-icon">
    <link rel="shortcut icon" href="./WhatsappEasy.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="./WhatsappEasy.ico">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-green:   #1a4b3a;
            --secondary-green: #2d7a5f;
            --accent-teal:     #00b4a6;
            --light-gray:      #ecf0f1;
            --white:           #ffffff;
            --glass-bg:        rgba(255,255,255,0.10);
            --glass-border:    rgba(255,255,255,0.20);
            --wa-green:        #25D366;
            --wa-green-dark:   #1da851;
            --error-red:       #ff6b6b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--secondary-green) 50%, var(--accent-teal) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            color: var(--white);
        }

        .background-animation {
            position: fixed; top:0; left:0; width:100%; height:100%;
            z-index: -1; opacity: 0.10;
        }
        .particle {
            position: absolute; background: var(--white); border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-20px) rotate(180deg); }
        }

        header {
            position: sticky; top: 0;
            background: rgba(26,75,58,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000; padding: 1rem 0;
        }
        nav {
            max-width: 1200px; margin: 0 auto;
            padding: 0 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--white); text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a {
            color: var(--white); text-decoration: none;
            transition: color .3s ease; font-size: .95rem;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-teal); }

        main {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 3rem 1rem;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%; max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }

        .card-icon { font-size: 3rem; text-align: center; margin-bottom: 1rem; }
        .card-title {
            font-size: 1.6rem; font-weight: 700;
            text-align: center; margin-bottom: .4rem;
        }
        .card-sub {
            text-align: center; font-size: .95rem;
            opacity: .75; margin-bottom: 2rem;
        }

        .field { margin-bottom: 1.4rem; }
        .field label {
            display: block; font-size: .85rem; font-weight: 600;
            margin-bottom: .5rem; opacity: .9;
        }

        .input-wrap { position: relative; }
        .prefix {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            font-weight: 600; font-size: 1rem; opacity: .8; pointer-events: none;
        }
        input[type="tel"] {
            width: 100%; padding: .85rem 1rem .85rem 3.2rem;
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.25);
            border-radius: 12px; color: var(--white);
            font-size: 1rem; font-family: inherit;
            transition: border-color .25s, box-shadow .25s;
            outline: none;
        }
        input[type="tel"]::placeholder { color: rgba(255,255,255,0.4); }
        input[type="tel"]:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(0,180,166,0.25);
        }
        input[type="tel"].error { border-color: var(--error-red); }

        textarea {
            width: 100%;
            padding: .85rem 1rem;
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.25);
            border-radius: 12px; color: var(--white);
            font-size: 1rem; font-family: inherit;
            resize: vertical; min-height: 110px;
            transition: border-color .25s, box-shadow .25s;
            outline: none;
        }
        textarea::placeholder { color: rgba(255,255,255,0.4); }
        textarea:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 3px rgba(0,180,166,0.25);
        }

        .error-msg {
            color: var(--error-red); font-size: .8rem;
            margin-top: .4rem; display: none;
        }
        .error-msg.show { display: block; }

        .btn-wa {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--wa-green), var(--wa-green-dark));
            color: #fff; border: none; border-radius: 14px;
            font-size: 1.1rem; font-weight: 700; font-family: inherit;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: .6rem;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 4px 15px rgba(37,211,102,0.35);
            margin-top: .5rem;
        }
        .btn-wa:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37,211,102,0.45);
        }
        .btn-wa:active { transform: scale(.97); }

        footer {
            background: rgba(26,75,58,0.95);
            color: var(--light-gray);
            text-align: center;
            padding: 1.5rem 0;
        }
        .footer-note { font-size: .85rem; opacity: .75; margin-top: .4rem; }
        .footer-note a {
            color: var(--accent-teal);
            text-decoration: none;
            transition: opacity .3s ease;
        }
        .footer-note a:hover { opacity: .75; text-decoration: underline; }

        @media (max-width: 520px) {
            .card { padding: 2rem 1.25rem; border-radius: 18px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <div class="background-animation" id="bgAnim"></div>

    <header>
        <nav>
            <a href="./index.html" class="logo">Alexander Bacca</a>
            <ul class="nav-links">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./index.html#tools">Tools</a></li>
                <li><a href="./index.html#projects">Projects</a></li>
                <li><a href="./index.html#contact">Contact</a></li>
                <li><a href="whatsapp-tool.html" class="active">WA Message</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="card">
            <div class="card-icon">💬</div>
            <h1 class="card-title">WhatsApp Quick Message</h1>
            <p class="card-sub">Send a message to any Colombian number — no need to save the contact.</p>

            <div class="field">
                <label for="phone">Phone Number</label>
                <div class="input-wrap">
                    <span class="prefix">+57</span>
                    <input type="tel" id="phone" placeholder="3001234567" maxlength="10" inputmode="numeric">
                </div>
                <p class="error-msg" id="phoneError">Please enter a valid 10-digit Colombian number.</p>
            </div>

            <div class="field">
                <label for="message">Message <span style="font-weight:400;opacity:.7">(optional)</span></label>
                <textarea id="message" placeholder="Type your message here…"></textarea>
            </div>

            <button class="btn-wa" id="sendBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                Open in WhatsApp
            </button>
        </div>
    </main>

    <footer>
        <div>
            <p>&copy; 2025 Alexander Bacca</p>
            <p class="footer-note">Reach out at <a href="mailto:hello@alexanderbacca.com">hello@alexanderbacca.com</a></p>
        </div>
    </footer>

    <script>
        // Particle background
        const bg = document.getElementById('bgAnim');
        for (let i = 0; i < 8; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*6+2}px;height:${Math.random()*6+2}px;animation-delay:${Math.random()*6}s`;
            bg.appendChild(p);
        }

        document.getElementById('sendBtn').addEventListener('click', () => {
            const raw   = document.getElementById('phone').value.trim().replace(/\D/g, '');
            const msg   = document.getElementById('message').value.trim();
            const errEl = document.getElementById('phoneError');
            const input = document.getElementById('phone');

            if (raw.length !== 10) {
                input.classList.add('error');
                errEl.classList.add('show');
                input.focus();
                return;
            }
            input.classList.remove('error');
            errEl.classList.remove('show');

            const url = `https://wa.me/57${raw}${msg ? '?text=' + encodeURIComponent(msg) : ''}`;
            window.open(url, '_blank', 'noopener,noreferrer');
        });

        document.getElementById('phone').addEventListener('input', function () {
            this.value = this.value.replace(/\D/g, '');
            this.classList.remove('error');
            document.getElementById('phoneError').classList.remove('show');
        });
    </script>
</body>
</html>
