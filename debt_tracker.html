<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt Tracker</title>
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/mdi/wallet.svg?color=%23d4af37">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0a0a0a; }
    .glow-card { box-shadow: 0 0 0 1px rgba(212,175,55,0.08), 0 4px 20px -4px rgba(0,0,0,0.6); }
    .glow-gold { box-shadow: 0 0 20px -4px rgba(212,175,55,0.35); }
    .glow-emerald { box-shadow: 0 0 16px -4px rgba(16,185,129,0.35); }
    .glow-rose { box-shadow: 0 0 16px -4px rgba(244,63,94,0.35); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; }
  </style>
</head>
<body class="min-h-screen pb-10 text-slate-200" style="background-color:#0a0a0a;">

  <!-- Header -->
  <header class="py-6 px-4 text-center border-b border-white/5" style="background-color:#121212;">
    <h1 class="text-xl font-bold tracking-wide text-amber-400">Debt Tracker</h1>
    <p class="text-xs text-slate-500 mt-1 tracking-wide">Quick Ledger & Silent Google Sync</p>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Status Alert Toast -->
    <div id="toast" class="hidden p-3 rounded-lg text-sm font-semibold text-center transition-all duration-300"></div>

    <!-- Transaction Entry Form -->
    <section class="p-5 rounded-2xl glow-card border border-white/5" style="background-color:#141414;">
      <h2 class="text-base font-bold text-amber-400 mb-4 flex items-center gap-2 tracking-wide">
        <span>New Entry</span>
      </h2>

      <form id="debtForm" class="space-y-4">

        <!-- Transaction Type Toggle -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Transaction Type</label>
          <div class="grid grid-cols-2 gap-2 p-1 rounded-xl" style="background-color:#0a0a0a;">
            <button type="button" id="btnLent" onclick="setType('lent')" class="py-2 rounded-lg text-sm font-bold bg-emerald-500 text-white glow-emerald transition">
              Money Lent (+)
            </button>
            <button type="button" id="btnRepay" onclick="setType('repay')" class="py-2 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-200 transition">
              Repayment (-)
            </button>
          </div>
          <input type="hidden" id="txType" value="lent">
        </div>

        <!-- Date Input -->
        <div>
          <label for="date" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Date</label>
          <input type="date" id="date" required class="w-full border border-white/10 rounded-xl p-3 text-slate-200 focus:ring-2 focus:ring-amber-400 focus:outline-none" style="background-color:#0a0a0a;">
        </div>

        <!-- Description Input -->
        <div>
          <label for="description" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Description <span class="text-slate-600 font-normal">(Optional)</span></label>
          <input type="text" id="description" placeholder="e.g. Lunch, Hardware store, Cash payback" class="w-full border border-white/10 rounded-xl p-3 text-slate-200 placeholder-slate-600 focus:ring-2 focus:ring-amber-400 focus:outline-none" style="background-color:#0a0a0a;">
        </div>

        <!-- Payment Method -->
        <div>
          <label for="method" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Payment Method</label>
          <select id="method" required class="w-full border border-white/10 rounded-xl p-3 text-slate-200 focus:ring-2 focus:ring-amber-400 focus:outline-none" style="background-color:#0a0a0a;">
            <option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Debit Card">Debit Card</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Amount Input -->
        <div>
          <label for="amount" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Amount ($)</label>
          <input type="number" step="0.01" id="amount" placeholder="0.00" required class="w-full border border-white/10 rounded-xl p-3 text-slate-100 text-lg font-bold placeholder-slate-600 focus:ring-2 focus:ring-amber-400 focus:outline-none" style="background-color:#0a0a0a;">
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-xl glow-gold transition active:scale-[0.98]">
          Save & Sync Entry
        </button>
      </form>
    </section>

    <!-- Local Storage: Last 5 Movements -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Last 5 Movements (Local)</h3>
        <span class="text-xs text-slate-600">Tap card to load</span>
      </div>

      <div id="recentList" class="space-y-2">
        <!-- Dynamic Cards Inserted Here -->
      </div>
    </section>

  </main>

  <script>
    // --- GOOGLE FORM CONFIGURATION ---
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSccER86-7s1gIHj-S7vcZwOIXUighDgw3hNiaK304X0NrqpOQ/formResponse";
    const ENTRY_IDS = {
      date: "entry.1879533945",
      description: "entry.843653909",
      method: "entry.1728172138",
      amount: "entry.290996914"
    };

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("date").value = new Date().toISOString().split("T")[0];
      renderRecentMovements();
    });

    // --- TYPE TOGGLE LOGIC ---
    function setType(type) {
      const btnLent = document.getElementById("btnLent");
      const btnRepay = document.getElementById("btnRepay");
      const txType = document.getElementById("txType");

      txType.value = type;
      if (type === "lent") {
        btnLent.className = "py-2 rounded-lg text-sm font-bold bg-emerald-500 text-white glow-emerald transition";
        btnRepay.className = "py-2 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-200 transition";
      } else {
        btnLent.className = "py-2 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-200 transition";
        btnRepay.className = "py-2 rounded-lg text-sm font-bold bg-rose-500 text-white glow-rose transition";
      }
    }

    // --- FORM SUBMISSION & SILENT SYNC ---
    document.getElementById("debtForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Syncing...";

      const date = document.getElementById("date").value;
      const description = document.getElementById("description").value || "-";
      const method = document.getElementById("method").value;
      const rawAmount = parseFloat(document.getElementById("amount").value);
      const isLent = document.getElementById("txType").value === "lent";

      const finalAmount = isLent ? Math.abs(rawAmount) : -Math.abs(rawAmount);

      const formData = new URLSearchParams();
      formData.append(ENTRY_IDS.date, date);
      formData.append(ENTRY_IDS.description, description);
      formData.append(ENTRY_IDS.method, method);
      formData.append(ENTRY_IDS.amount, finalAmount);

      let success = false;

      try {
        await fetch(FORM_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });
        success = true;
      } catch (err) {
        console.warn("Network submission failed, saved locally only.", err);
        success = false;
      }

      saveToLocalStorage({
        id: Date.now(),
        date,
        description,
        method,
        amount: finalAmount,
        synced: success
      });

      showToast(
        success ? "Saved & Synced to Google Sheets!" : "Saved locally (Offline mode)",
        success ? "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30" : "bg-amber-500/10 text-amber-400 border border-amber-500/30"
      );

      document.getElementById("description").value = "";
      document.getElementById("amount").value = "";
      document.getElementById("date").value = new Date().toISOString().split("T")[0];
      setType("lent");

      submitBtn.disabled = false;
      submitBtn.innerText = "Save & Sync Entry";

      renderRecentMovements();
    });

    // --- LOCAL STORAGE MANAGER ---
    function getStoredMovements() {
      return JSON.parse(localStorage.getItem("debt_tracker_recent") || "[]");
    }

    function saveToLocalStorage(entry) {
      let list = getStoredMovements();
      list.unshift(entry);
      list = list.slice(0, 5);
      localStorage.setItem("debt_tracker_recent", JSON.stringify(list));
    }

    // --- UI RENDERER FOR LAST 5 MOVEMENTS ---
    function renderRecentMovements() {
      const list = getStoredMovements();
      const container = document.getElementById("recentList");

      if (list.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-500 rounded-xl border border-dashed border-white/10" style="background-color:#141414;">No entries saved locally yet.</div>`;
        return;
      }

      container.innerHTML = list.map((item) => {
        const isPositive = item.amount > 0;
        const formattedAmount = (isPositive ? "+" : "") + Number(item.amount).toFixed(2);
        const badgeColor = isPositive ? "text-emerald-400 bg-emerald-500/10" : "text-rose-400 bg-rose-500/10";

        return `
          <div onclick="loadEntryIntoForm(${item.id})" class="p-3.5 rounded-xl border border-white/5 glow-card flex justify-between items-center cursor-pointer hover:border-amber-400/40 transition active:scale-[0.99]" style="background-color:#141414;">
            <div class="space-y-0.5">
              <div class="text-sm font-bold text-slate-200">${escapeHtml(item.description)}</div>
              <div class="text-xs text-slate-500 flex gap-2">
                <span>${item.date}</span>
                <span>•</span>
                <span>${escapeHtml(item.method)}</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-base font-extrabold ${badgeColor} px-2.5 py-1 rounded-lg inline-block">
                $${formattedAmount}
              </div>
              <div class="text-[10px] mt-0.5 ${item.synced ? 'text-emerald-500' : 'text-amber-500'}">${item.synced ? "Synced" : "Local"}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    // --- RE-LOAD PAST ENTRY INTO FORM ---
    function loadEntryIntoForm(id) {
      const list = getStoredMovements();
      const entry = list.find(item => item.id === id);
      if (!entry) return;

      document.getElementById("date").value = entry.date;
      document.getElementById("description").value = entry.description === "-" ? "" : entry.description;
      document.getElementById("method").value = entry.method;
      document.getElementById("amount").value = Math.abs(entry.amount);
      setType(entry.amount > 0 ? "lent" : "repay");

      showToast("Loaded entry into form. Edit or resubmit!", "bg-amber-500/10 text-amber-400 border border-amber-500/30");
    }

    // --- HELPER FUNCTIONS ---
    function showToast(msg, classes) {
      const toast = document.getElementById("toast");
      toast.className = `p-3 rounded-lg text-sm font-semibold text-center transition-all duration-300 ${classes}`;
      toast.innerText = msg;
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3500);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
